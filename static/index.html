<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ace</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --transition: 0.25s ease;
}

[data-theme="dark"] {
  --bg:        #0d0d10;
  --surface:   #16161d;
  --surface2:  #1e1e28;
  --surface3:  #26262f;
  --border:    #2c2c3a;
  --text:      #e8e8f0;
  --text2:     #9090a8;
  --text3:     #5a5a72;
  --accent:    #7c6ef5;
  --accent2:   #4ec9a0;
  --danger:    #f56e6e;
  --user-bg:   #7c6ef5;
  --user-text: #ffffff;
  --shadow:    0 4px 24px rgba(0,0,0,0.4);
}

[data-theme="light"] {
  --bg:        #f0f0f5;
  --surface:   #ffffff;
  --surface2:  #f5f5fa;
  --surface3:  #ebebf5;
  --border:    #e0e0ea;
  --text:      #1a1a2e;
  --text2:     #5a5a7a;
  --text3:     #9090b0;
  --accent:    #6c5ce7;
  --accent2:   #00b894;
  --danger:    #e55353;
  --user-bg:   #6c5ce7;
  --user-text: #ffffff;
  --shadow:    0 4px 24px rgba(0,0,0,0.08);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: background var(--transition), color var(--transition);
}

/* ── Header ── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  transition: background var(--transition), border-color var(--transition);
}

.header-left { display: flex; align-items: center; gap: 12px; }

.avatar {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 700; color: #fff;
  flex-shrink: 0;
}

.header-info h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
.status { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--accent2); }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent2); }

.header-right { display: flex; align-items: center; gap: 6px; }

.nav-tabs { display: flex; gap: 2px; }

.tab-btn {
  background: none; border: none;
  color: var(--text2); padding: 6px 12px;
  border-radius: 8px; cursor: pointer;
  font-size: 13px; font-weight: 500;
  transition: all var(--transition);
}
.tab-btn:hover { background: var(--surface2); color: var(--text); }
.tab-btn.active { background: var(--accent); color: #fff; }

.icon-btn {
  width: 34px; height: 34px;
  background: none; border: 1px solid var(--border);
  border-radius: 8px; cursor: pointer; color: var(--text2);
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
}
.icon-btn:hover { background: var(--surface2); color: var(--text); }

/* ── Main ── */
main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
.panel { display: none; flex: 1; overflow: hidden; flex-direction: column; }
.panel.active { display: flex; }

/* ── Messages ── */
#chat-messages {
  flex: 1; overflow-y: auto; padding: 24px 20px;
  display: flex; flex-direction: column; gap: 20px;
}

#chat-messages::-webkit-scrollbar { width: 3px; }
#chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.msg { display: flex; gap: 10px; max-width: 76%; animation: msgIn 0.2s ease; }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg.ace  { align-self: flex-start; }

@keyframes msgIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.msg-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; flex-shrink: 0; margin-top: 2px;
}

.msg.ace  .msg-avatar { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
.msg.user .msg-avatar { background: var(--surface3); color: var(--text2); }

.msg-body { display: flex; flex-direction: column; gap: 4px; }

.msg-bubble {
  padding: 10px 14px; border-radius: 14px;
  font-size: 14px; line-height: 1.55;
  white-space: pre-wrap; word-break: break-word;
  transition: background var(--transition);
}

.msg.ace  .msg-bubble { background: var(--surface); border-bottom-left-radius: 4px; color: var(--text); }
.msg.user .msg-bubble { background: var(--user-bg); border-bottom-right-radius: 4px; color: var(--user-text); }

.msg-time { font-size: 10px; color: var(--text3); }
.msg.user .msg-time { text-align: right; }

/* speak btn on ace messages */
.speak-btn {
  background: none; border: none; cursor: pointer;
  color: var(--text3); padding: 2px 4px; border-radius: 4px;
  font-size: 12px; transition: color var(--transition);
  align-self: flex-start;
}
.speak-btn:hover { color: var(--accent2); }

/* typing */
.typing-bubble {
  display: flex; align-items: center; gap: 4px;
  padding: 12px 16px;
  background: var(--surface); border-radius: 14px; border-bottom-left-radius: 4px;
  width: fit-content;
}
.typing-bubble span {
  width: 6px; height: 6px; border-radius: 50%; background: var(--text3);
  animation: bounce 1.2s infinite;
}
.typing-bubble span:nth-child(2) { animation-delay: 0.2s; }
.typing-bubble span:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounce {
  0%,60%,100% { transform: translateY(0); }
  30%          { transform: translateY(-5px); }
}

/* ── Input area ── */
.input-wrap {
  padding: 12px 16px 16px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  transition: background var(--transition), border-color var(--transition);
}

.input-row {
  display: flex; gap: 8px; align-items: flex-end;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 8px 8px 8px 14px;
  transition: border-color var(--transition), background var(--transition);
}
.input-row:focus-within { border-color: var(--accent); }

#msg-input {
  flex: 1; background: none; border: none; outline: none;
  color: var(--text); font-size: 14px; resize: none;
  max-height: 120px; font-family: inherit; line-height: 1.45;
  padding: 2px 0;
}
#msg-input::placeholder { color: var(--text3); }

.input-btns { display: flex; gap: 4px; align-items: flex-end; }

.round-btn {
  width: 34px; height: 34px; border-radius: 10px; border: none;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all var(--transition); flex-shrink: 0;
}

#mic-btn { background: var(--surface3); color: var(--text2); }
#mic-btn:hover { background: var(--accent); color: #fff; }
#mic-btn.listening { background: var(--danger); color: #fff; animation: pulse 1s infinite; }

#send-btn { background: var(--accent); color: #fff; }
#send-btn:hover { opacity: 0.85; }
#send-btn:disabled { opacity: 0.35; cursor: not-allowed; }

@keyframes pulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(245,110,110,0.4); }
  50%      { box-shadow: 0 0 0 8px rgba(245,110,110,0); }
}

.voice-bar {
  display: none; align-items: center; gap: 8px;
  padding: 8px 0 0; font-size: 12px; color: var(--danger);
}
.voice-bar.active { display: flex; }

/* ── Panels: stats / tasks / rules ── */
.panel-scroll { flex: 1; overflow-y: auto; padding: 20px; }
.panel-scroll::-webkit-scrollbar { width: 3px; }
.panel-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.page-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 20px;
}
.page-title { font-size: 20px; font-weight: 700; letter-spacing: -0.4px; }

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 16px; margin-bottom: 14px;
  transition: background var(--transition), border-color var(--transition);
  box-shadow: var(--shadow);
}
.card-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 12px; font-weight: 600; }

.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }

.stat-box {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px; text-align: center;
  box-shadow: var(--shadow);
}
.stat-val { font-size: 24px; font-weight: 700; color: var(--accent2); letter-spacing: -0.5px; }
.stat-val.neg { color: var(--danger); }
.stat-label { font-size: 11px; color: var(--text3); margin-top: 4px; font-weight: 500; }

.trade-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 11px 0; border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.trade-row:last-child { border-bottom: none; }
.trade-sym { font-weight: 600; }
.trade-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }
.trade-right { display: flex; align-items: center; gap: 8px; }
.pnl { font-weight: 600; }
.pnl.pos { color: var(--accent2); }
.pnl.neg { color: var(--danger); }

.badge { font-size: 10px; padding: 2px 7px; border-radius: 20px; font-weight: 600; }
.badge.ok   { background: rgba(78,201,160,0.12); color: var(--accent2); }
.badge.broke{ background: rgba(245,110,110,0.12); color: var(--danger); }

.task-row {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 0; border-bottom: 1px solid var(--border); font-size: 14px;
}
.task-row:last-child { border-bottom: none; }

.check-circle {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid var(--border); cursor: pointer;
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
}
.check-circle:hover { border-color: var(--accent2); background: rgba(78,201,160,0.1); }

.task-text { flex: 1; }
.pri { font-size: 10px; padding: 2px 7px; border-radius: 20px; font-weight: 600; }
.pri.high   { background: rgba(245,110,110,0.12); color: var(--danger); }
.pri.medium { background: rgba(124,110,245,0.12); color: var(--accent); }
.pri.low    { background: rgba(144,144,168,0.1); color: var(--text3); }

.rule-row {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 11px 0; border-bottom: 1px solid var(--border); font-size: 14px;
}
.rule-row:last-child { border-bottom: none; }
.rule-num {
  min-width: 24px; height: 24px; background: var(--accent);
  border-radius: 6px; display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0; margin-top: 1px;
}

.empty { text-align: center; color: var(--text3); padding: 36px 20px; font-size: 14px; }

/* ── Buttons ── */
.btn {
  background: var(--accent); color: #fff; border: none;
  border-radius: 10px; padding: 9px 16px; cursor: pointer;
  font-size: 13px; font-weight: 600; transition: opacity var(--transition);
}
.btn:hover { opacity: 0.85; }
.btn.ghost {
  background: var(--surface2); color: var(--text);
  border: 1px solid var(--border);
}
.btn.ghost:hover { background: var(--surface3); opacity: 1; }

/* ── Modal ── */
.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.55); backdrop-filter: blur(4px);
  z-index: 100; align-items: center; justify-content: center; padding: 20px;
}
.overlay.open { display: flex; }

.modal {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 18px; padding: 28px; width: 100%; max-width: 420px;
  box-shadow: var(--shadow); animation: modalIn 0.2s ease;
}

@keyframes modalIn {
  from { opacity: 0; transform: scale(0.95) translateY(10px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}

.modal h2 { font-size: 18px; font-weight: 700; margin-bottom: 20px; letter-spacing: -0.3px; }

.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 6px; font-weight: 500; }
.field input, .field select, .field textarea {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 12px; color: var(--text); font-size: 14px;
  outline: none; font-family: inherit; transition: border-color var(--transition), background var(--transition);
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.field select option { background: var(--surface2); }

.field-row { display: flex; gap: 10px; }
.field-row .field { flex: 1; }

.modal-actions { display: flex; gap: 8px; margin-top: 22px; }
.modal-actions .btn { flex: 1; padding: 10px; }

/* speak toggle */
.speak-toggle {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--text2); cursor: pointer;
  padding: 4px 8px; border-radius: 8px;
  transition: background var(--transition);
}
.speak-toggle:hover { background: var(--surface2); }

.toggle-pill {
  width: 32px; height: 18px; border-radius: 9px;
  background: var(--border); position: relative;
  transition: background var(--transition); flex-shrink: 0;
}
.toggle-pill::after {
  content: ''; position: absolute;
  width: 12px; height: 12px; border-radius: 50%;
  background: #fff; top: 3px; left: 3px;
  transition: transform var(--transition);
}
.toggle-pill.on { background: var(--accent2); }
.toggle-pill.on::after { transform: translateX(14px); }

@media (max-width: 580px) {
  .nav-tabs .tab-btn { padding: 6px 9px; font-size: 12px; }
  .msg { max-width: 90%; }
}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="avatar">A</div>
    <div class="header-info">
      <h1>Ace</h1>
      <div class="status"><div class="status-dot"></div>Online</div>
    </div>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" data-panel="chat">Chat</button>
    <button class="tab-btn" data-panel="stats">Stats</button>
    <button class="tab-btn" data-panel="tasks">Tasks</button>
    <button class="tab-btn" data-panel="rules">Rules</button>
  </div>

  <div class="header-right">
    <label class="speak-toggle" title="Ace speaks back">
      <span>Voice</span>
      <div class="toggle-pill" id="speak-toggle-pill"></div>
    </label>
    <button class="icon-btn" id="theme-btn" title="Toggle theme">
      <svg id="theme-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    </button>
  </div>
</header>

<main>

  <!-- Chat -->
  <div id="panel-chat" class="panel active">
    <div id="chat-messages"></div>
    <div class="input-wrap">
      <div class="input-row">
        <textarea id="msg-input" placeholder="Chat with Ace, or type /help…" rows="1"></textarea>
        <div class="input-btns">
          <button class="round-btn" id="mic-btn" title="Hold to speak">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          </button>
          <button class="round-btn" id="send-btn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
      <div class="voice-bar" id="voice-bar">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="var(--danger)" stroke="none"><circle cx="12" cy="12" r="10"/></svg>
        Listening… speak now
      </div>
    </div>
  </div>

  <!-- Stats -->
  <div id="panel-stats" class="panel">
    <div class="panel-scroll">
      <div class="page-header">
        <div class="page-title">Trading Stats</div>
        <button class="btn" onclick="openModal('trade-modal')">+ Log Trade</button>
      </div>
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-val" id="s-trades">—</div><div class="stat-label">Total Trades</div></div>
        <div class="stat-box"><div class="stat-val" id="s-wr">—</div><div class="stat-label">Win Rate</div></div>
        <div class="stat-box"><div class="stat-val" id="s-pnl">—</div><div class="stat-label">Total P&amp;L</div></div>
        <div class="stat-box"><div class="stat-val" id="s-streak">—</div><div class="stat-label">Win Streak</div></div>
      </div>
      <div class="card">
        <div class="card-label">Recent Trades</div>
        <div id="journal-list"></div>
      </div>
    </div>
  </div>

  <!-- Tasks -->
  <div id="panel-tasks" class="panel">
    <div class="panel-scroll">
      <div class="page-header">
        <div class="page-title">Tasks</div>
        <button class="btn" onclick="openModal('task-modal')">+ Add Task</button>
      </div>
      <div class="card">
        <div id="task-list"></div>
      </div>
    </div>
  </div>

  <!-- Rules -->
  <div id="panel-rules" class="panel">
    <div class="panel-scroll">
      <div class="page-header">
        <div class="page-title">Trading Rules</div>
        <button class="btn" onclick="openRulesModal()">Edit</button>
      </div>
      <div class="card">
        <div id="rules-list"></div>
      </div>
    </div>
  </div>

</main>

<!-- Trade Modal -->
<div class="overlay" id="trade-modal">
  <div class="modal">
    <h2>Log a Trade</h2>
    <div class="field-row">
      <div class="field"><label>Symbol</label><input id="t-sym" placeholder="EURUSD" /></div>
      <div class="field"><label>Direction</label>
        <select id="t-dir"><option value="long">Long</option><option value="short">Short</option></select>
      </div>
    </div>
    <div class="field-row">
      <div class="field"><label>Entry</label><input id="t-entry" type="number" step="any" placeholder="1.0850" /></div>
      <div class="field"><label>Exit</label><input id="t-exit" type="number" step="any" placeholder="1.0900" /></div>
    </div>
    <div class="field"><label>Size</label><input id="t-size" type="number" step="any" placeholder="1.0" /></div>
    <div class="field"><label>Notes</label><textarea id="t-notes" rows="2" placeholder="What happened?"></textarea></div>
    <div class="field"><label>Followed your rules?</label>
      <select id="t-rules"><option value="yes">Yes ✓</option><option value="no">No ✗</option></select>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal('trade-modal')">Cancel</button>
      <button class="btn" onclick="submitTrade()">Log Trade</button>
    </div>
  </div>
</div>

<!-- Task Modal -->
<div class="overlay" id="task-modal">
  <div class="modal">
    <h2>Add Task</h2>
    <div class="field"><label>Task</label><input id="tk-title" placeholder="What needs to get done?" /></div>
    <div class="field"><label>Priority</label>
      <select id="tk-pri"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal('task-modal')">Cancel</button>
      <button class="btn" onclick="submitTask()">Add Task</button>
    </div>
  </div>
</div>

<!-- Rules Modal -->
<div class="overlay" id="rules-modal">
  <div class="modal">
    <h2>Trading Rules</h2>
    <div class="field"><label>One rule per line</label>
      <textarea id="rules-ta" rows="7" placeholder="Only trade with the trend&#10;Max 2% risk per trade&#10;No revenge trading"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal('rules-modal')">Cancel</button>
      <button class="btn" onclick="submitRules()">Save</button>
    </div>
  </div>
</div>

<script>
// ── Helpers ──
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
const stripRich = s => s.replace(/\[\/?\w[\w\s]*\]/g, '');

// ── Theme ──
const html = document.documentElement;
let theme = localStorage.getItem('ace-theme') || 'dark';
html.setAttribute('data-theme', theme);

$('theme-btn').addEventListener('click', () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', theme);
  localStorage.setItem('ace-theme', theme);
});

// ── Voice (speech synthesis) ──
let speakEnabled = localStorage.getItem('ace-speak') === '1';
const pill = $('speak-toggle-pill');
if (speakEnabled) pill.classList.add('on');

pill.parentElement.addEventListener('click', () => {
  speakEnabled = !speakEnabled;
  pill.classList.toggle('on', speakEnabled);
  localStorage.setItem('ace-speak', speakEnabled ? '1' : '0');
});

function speak(text) {
  if (!speakEnabled || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  // prefer a natural English voice (Microsoft/Google)
  const voices = window.speechSynthesis.getVoices();
  const preferred = voices.find(v => v.name.includes('Microsoft') && v.lang.startsWith('en'))
    || voices.find(v => v.lang.startsWith('en-'));
  if (preferred) utt.voice = preferred;
  utt.rate = 1.05; utt.pitch = 1.0;
  window.speechSynthesis.speak(utt);
}

// load voices (async on some browsers)
if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = () => {};
  window.speechSynthesis.getVoices();
}

// ── Speech recognition ──
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null;
let listening = false;

if (SpeechRec) {
  recog = new SpeechRec();
  recog.continuous = false;
  recog.interimResults = true;
  recog.lang = 'en-US';

  recog.onresult = e => {
    const transcript = Array.from(e.results).map(r => r[0].transcript).join('');
    $('msg-input').value = transcript;
    autoResize($('msg-input'));
    if (e.results[0].isFinal) stopListening();
  };

  recog.onend = () => stopListening();
  recog.onerror = () => stopListening();
}

function startListening() {
  if (!recog) { alert('Speech recognition not supported in this browser. Try Chrome or Edge.'); return; }
  listening = true;
  $('mic-btn').classList.add('listening');
  $('voice-bar').classList.add('active');
  recog.start();
}

function stopListening() {
  listening = false;
  $('mic-btn').classList.remove('listening');
  $('voice-bar').classList.remove('active');
  try { recog.stop(); } catch(e) {}
}

$('mic-btn').addEventListener('click', () => {
  if (listening) stopListening();
  else startListening();
});

// ── Tabs ──
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    const id = 'panel-' + btn.dataset.panel;
    $(id).classList.add('active');
    if (btn.dataset.panel === 'stats') loadStats();
    if (btn.dataset.panel === 'tasks') loadTasks();
    if (btn.dataset.panel === 'rules') loadRules();
  });
});

// ── Chat ──
const msgsEl = $('chat-messages');

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  const clean = stripRich(text);
  const avatarLabel = role === 'ace' ? 'A' : 'Y';

  let extra = '';
  if (role === 'ace') {
    extra = `<button class="speak-btn" onclick="speak(this.dataset.text)" data-text="${clean.replace(/"/g,'&quot;')}">🔊</button>`;
  }

  div.innerHTML = `
    <div class="msg-avatar">${avatarLabel}</div>
    <div class="msg-body">
      <div class="msg-bubble">${esc(clean)}</div>
      <div style="display:flex;align-items:center;gap:6px">
        <span class="msg-time">${time}</span>${extra}
      </div>
    </div>`;
  msgsEl.appendChild(div);
  msgsEl.scrollTop = msgsEl.scrollHeight;
  if (role === 'ace') speak(clean);
}

function showTyping() {
  const d = document.createElement('div');
  d.className = 'msg ace'; d.id = 'typing';
  d.innerHTML = `<div class="msg-avatar">A</div><div class="typing-bubble"><span></span><span></span><span></span></div>`;
  msgsEl.appendChild(d);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}
function hideTyping() { const t = $('typing'); if(t) t.remove(); }

async function sendMessage() {
  const inp = $('msg-input');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = ''; inp.style.height = 'auto';
  addMsg('user', text);
  $('send-btn').disabled = true;
  showTyping();
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({message: text})
    });
    const data = await res.json();
    hideTyping();
    if (data.type === 'trade_form') {
      openModal('trade-modal');
      addMsg('ace', 'Opening the trade log for you.');
    } else {
      addMsg('ace', data.text);
    }
  } catch(e) {
    hideTyping();
    addMsg('ace', 'Connection error — try again.');
  }
  $('send-btn').disabled = false;
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

$('msg-input').addEventListener('input', () => autoResize($('msg-input')));
$('msg-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
$('send-btn').addEventListener('click', sendMessage);

// welcome
setTimeout(() => addMsg('ace', "Hey! I'm Ace — your accountability partner. What's on your mind?"), 300);

// ── Stats ──
async function loadStats() {
  const [stats, journal] = await Promise.all([
    fetch('/api/stats').then(r=>r.json()),
    fetch('/api/journal').then(r=>r.json())
  ]);
  $('s-trades').textContent = stats.total_trades;
  $('s-wr').textContent = stats.win_rate + '%';
  const pEl = $('s-pnl');
  pEl.textContent = (stats.total_pnl >= 0 ? '+' : '') + '$' + Math.abs(stats.total_pnl).toFixed(2);
  pEl.className = 'stat-val' + (stats.total_pnl < 0 ? ' neg' : '');
  $('s-streak').textContent = stats.streak + (stats.streak >= 3 ? ' 🔥' : '');

  const jEl = $('journal-list');
  if (!journal.length) { jEl.innerHTML = '<div class="empty">No trades yet.</div>'; return; }
  jEl.innerHTML = [...journal].reverse().map(t => `
    <div class="trade-row">
      <div><div class="trade-sym">${t.symbol}</div><div class="trade-sub">${t.direction.toUpperCase()} · ${t.date.slice(0,10)}</div></div>
      <div class="trade-right">
        <span class="badge ${t.followed_rules?'ok':'broke'}">${t.followed_rules?'Rules ✓':'Rules ✗'}</span>
        <span class="pnl ${t.pnl>=0?'pos':'neg'}">${t.pnl>=0?'+':''}$${t.pnl.toFixed(2)}</span>
      </div>
    </div>`).join('');
}

// ── Tasks ──
async function loadTasks() {
  const tasks = await fetch('/api/tasks').then(r=>r.json());
  const el = $('task-list');
  if (!tasks.length) { el.innerHTML = '<div class="empty">No pending tasks.</div>'; return; }
  el.innerHTML = tasks.map(t => `
    <div class="task-row" id="tk-${t.id}">
      <div class="check-circle" onclick="doneTask(${t.id})"></div>
      <div class="task-text">${esc(t.title)}</div>
      <span class="pri ${t.priority}">${t.priority}</span>
    </div>`).join('');
}

async function doneTask(id) {
  await fetch(`/api/tasks/${id}/complete`, {method:'POST'});
  const el = $(`tk-${id}`);
  if (el) { el.style.opacity='0.3'; setTimeout(()=>el.remove(),400); }
}

// ── Rules ──
async function loadRules() {
  const rules = await fetch('/api/rules').then(r=>r.json());
  const el = $('rules-list');
  if (!rules.length) { el.innerHTML = '<div class="empty">No rules set yet.</div>'; return; }
  el.innerHTML = rules.map((r,i) => `
    <div class="rule-row"><div class="rule-num">${i+1}</div><div>${esc(r)}</div></div>`).join('');
}

// ── Modals ──
function openModal(id) { $(id).classList.add('open'); }
function closeModal(id) { $(id).classList.remove('open'); }

async function openRulesModal() {
  const rules = await fetch('/api/rules').then(r=>r.json());
  $('rules-ta').value = rules.join('\n');
  openModal('rules-modal');
}

document.querySelectorAll('.overlay').forEach(o => {
  o.addEventListener('click', e => { if(e.target===o) o.classList.remove('open'); });
});

async function submitTrade() {
  const sym   = $('t-sym').value.trim();
  const entry = parseFloat($('t-entry').value);
  const exit  = parseFloat($('t-exit').value);
  const size  = parseFloat($('t-size').value);
  if (!sym || isNaN(entry) || isNaN(exit) || isNaN(size)) { alert('Fill in all fields.'); return; }
  const trade = await fetch('/api/trade', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({symbol:sym, direction:$('t-dir').value, entry, exit_price:exit, size,
      notes:$('t-notes').value, followed_rules:$('t-rules').value==='yes'})
  }).then(r=>r.json());
  closeModal('trade-modal');
  const pnl = trade.pnl >= 0 ? `+$${trade.pnl.toFixed(2)}` : `-$${Math.abs(trade.pnl).toFixed(2)}`;
  addMsg('ace', `Trade logged — ${trade.symbol} ${trade.direction.toUpperCase()} ${pnl}${!trade.followed_rules ? '\n\nYou broke your rules. We\'re talking about this.' : '. Solid.'}`);
  // switch to chat
  document.querySelector('[data-panel="chat"]').click();
}

async function submitTask() {
  const title = $('tk-title').value.trim();
  if (!title) return;
  await fetch('/api/tasks', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({title, priority:$('tk-pri').value})});
  $('tk-title').value = '';
  closeModal('task-modal');
  loadTasks();
}

async function submitRules() {
  const rules = $('rules-ta').value.split('\n').map(r=>r.trim()).filter(Boolean);
  await fetch('/api/rules', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({rules})});
  closeModal('rules-modal');
  loadRules();
}
</script>
