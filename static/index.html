<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ace — Your Accountability Partner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f13;
    --surface: #1a1a24;
    --surface2: #22222f;
    --accent: #6c63ff;
    --accent2: #4ecca3;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --danger: #ff6b6b;
    --success: #4ecca3;
    --border: #2a2a3a;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .header-left { display: flex; align-items: center; gap: 12px; }

  .avatar {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: bold; color: white;
    flex-shrink: 0;
  }

  .header-info h1 { font-size: 16px; font-weight: 600; }
  .header-info p { font-size: 12px; color: var(--accent2); }

  .header-tabs {
    display: flex; gap: 4px;
  }

  .tab-btn {
    background: none; border: 1px solid var(--border);
    color: var(--muted); padding: 6px 12px;
    border-radius: 20px; cursor: pointer;
    font-size: 12px; transition: all 0.2s;
  }

  .tab-btn.active, .tab-btn:hover {
    background: var(--accent); color: white; border-color: var(--accent);
  }

  /* Main layout */
  main {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .panel { display: none; flex: 1; overflow: hidden; flex-direction: column; }
  .panel.active { display: flex; }

  /* Chat panel */
  #chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  #chat-messages::-webkit-scrollbar { width: 4px; }
  #chat-messages::-webkit-scrollbar-track { background: transparent; }
  #chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg { display: flex; gap: 10px; max-width: 80%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.ace { align-self: flex-start; }

  .msg-avatar {
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: bold; flex-shrink: 0;
    margin-top: 2px;
  }

  .msg.ace .msg-avatar { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white; }
  .msg.user .msg-avatar { background: var(--surface2); color: var(--muted); }

  .msg-bubble {
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg.ace .msg-bubble {
    background: var(--surface);
    border-bottom-left-radius: 4px;
    color: var(--text);
  }

  .msg.user .msg-bubble {
    background: var(--accent);
    border-bottom-right-radius: 4px;
    color: white;
  }

  .msg-time {
    font-size: 10px; color: var(--muted);
    margin-top: 4px;
    text-align: right;
  }

  .msg.ace .msg-time { text-align: left; }

  .typing {
    display: flex; align-items: center; gap: 4px;
    padding: 10px 14px;
    background: var(--surface);
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    width: fit-content;
  }

  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }

  /* Input area */
  .input-area {
    padding: 12px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }

  #msg-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 10px 16px;
    color: var(--text);
    font-size: 14px;
    resize: none;
    max-height: 120px;
    outline: none;
    font-family: inherit;
    line-height: 1.4;
  }

  #msg-input::placeholder { color: var(--muted); }
  #msg-input:focus { border-color: var(--accent); }

  #send-btn {
    width: 40px; height: 40px;
    background: var(--accent);
    border: none; border-radius: 50%;
    color: white; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.2s;
  }

  #send-btn:hover { opacity: 0.85; }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Stats / Journal panels */
  .panel-content {
    flex: 1; overflow-y: auto; padding: 20px;
  }

  .panel-content::-webkit-scrollbar { width: 4px; }
  .panel-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }

  .card h3 { font-size: 13px; color: var(--muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }

  .stat-box {
    background: var(--surface2);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
  }

  .stat-box .val {
    font-size: 22px; font-weight: 700;
    color: var(--accent2);
  }

  .stat-box .val.neg { color: var(--danger); }
  .stat-box .label { font-size: 11px; color: var(--muted); margin-top: 4px; }

  .trade-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }

  .trade-item:last-child { border-bottom: none; }

  .trade-symbol { font-weight: 600; }
  .trade-dir { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .trade-pnl { font-weight: 600; }
  .trade-pnl.pos { color: var(--success); }
  .trade-pnl.neg { color: var(--danger); }
  .rules-badge { font-size: 11px; padding: 2px 6px; border-radius: 10px; }
  .rules-badge.ok { background: rgba(78,204,163,0.15); color: var(--success); }
  .rules-badge.broke { background: rgba(255,107,107,0.15); color: var(--danger); }

  .task-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }

  .task-item:last-child { border-bottom: none; }

  .task-check {
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid var(--border);
    cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }

  .task-check:hover { border-color: var(--accent2); }

  .task-title { flex: 1; }
  .priority { font-size: 10px; padding: 2px 6px; border-radius: 8px; }
  .priority.high { background: rgba(255,107,107,0.15); color: var(--danger); }
  .priority.medium { background: rgba(108,99,255,0.15); color: var(--accent); }
  .priority.low { background: rgba(107,107,128,0.15); color: var(--muted); }

  .empty-state {
    text-align: center; color: var(--muted);
    padding: 40px 20px; font-size: 14px;
  }

  .section-title {
    font-size: 18px; font-weight: 700;
    margin-bottom: 16px;
  }

  .btn {
    background: var(--accent); color: white;
    border: none; border-radius: 8px;
    padding: 10px 16px; cursor: pointer;
    font-size: 13px; font-weight: 600;
    transition: opacity 0.2s;
  }

  .btn:hover { opacity: 0.85; }
  .btn.secondary { background: var(--surface2); color: var(--text); }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center; justify-content: center;
    padding: 20px;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    width: 100%; max-width: 400px;
  }

  .modal h2 { font-size: 18px; margin-bottom: 20px; }

  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }

  .form-group input:focus, .form-group select:focus { border-color: var(--accent); }
  .form-group select option { background: var(--surface2); }

  .form-row { display: flex; gap: 10px; }
  .form-row .form-group { flex: 1; }

  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .modal-actions .btn { flex: 1; }

  .rules-list { display: flex; flex-direction: column; gap: 8px; }
  .rule-item {
    background: var(--surface2); border-radius: 8px;
    padding: 10px 14px; font-size: 13px;
    display: flex; align-items: center; gap: 8px;
  }

  .rule-num {
    width: 20px; height: 20px; background: var(--accent);
    border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 11px; font-weight: 700;
    flex-shrink: 0;
  }

  @media (max-width: 600px) {
    .header-tabs .tab-btn { padding: 6px 8px; font-size: 11px; }
    .msg { max-width: 92%; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="avatar">A</div>
    <div class="header-info">
      <h1>Ace</h1>
      <p>Online &amp; ready</p>
    </div>
  </div>
  <div class="header-tabs">
    <button class="tab-btn active" onclick="showPanel('chat')">Chat</button>
    <button class="tab-btn" onclick="showPanel('stats')">Stats</button>
    <button class="tab-btn" onclick="showPanel('tasks')">Tasks</button>
    <button class="tab-btn" onclick="showPanel('rules')">Rules</button>
  </div>
</header>

<main>

  <!-- Chat -->
  <div id="panel-chat" class="panel active">
    <div id="chat-messages"></div>
    <div class="input-area">
      <textarea id="msg-input" placeholder="Chat with Ace, or type /help for commands..." rows="1"></textarea>
      <button id="send-btn" onclick="sendMessage()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

  <!-- Stats -->
  <div id="panel-stats" class="panel">
    <div class="panel-content">
      <div class="section-title">Trading Stats</div>
      <div class="stats-grid" id="stats-grid">
        <div class="stat-box"><div class="val" id="s-trades">—</div><div class="label">Total Trades</div></div>
        <div class="stat-box"><div class="val" id="s-winrate">—</div><div class="label">Win Rate</div></div>
        <div class="stat-box"><div class="val" id="s-pnl">—</div><div class="label">Total P&amp;L</div></div>
        <div class="stat-box"><div class="val" id="s-streak">—</div><div class="label">Win Streak</div></div>
      </div>
      <div class="card">
        <h3>Recent Trades</h3>
        <div id="journal-list"></div>
      </div>
      <button class="btn" onclick="openTradeModal()" style="width:100%">+ Log a Trade</button>
    </div>
  </div>

  <!-- Tasks -->
  <div id="panel-tasks" class="panel">
    <div class="panel-content">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <div class="section-title" style="margin:0">Tasks</div>
        <button class="btn" onclick="openTaskModal()">+ Add Task</button>
      </div>
      <div class="card">
        <div id="task-list"></div>
      </div>
    </div>
  </div>

  <!-- Rules -->
  <div id="panel-rules" class="panel">
    <div class="panel-content">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <div class="section-title" style="margin:0">Trading Rules</div>
        <button class="btn" onclick="openRulesModal()">Edit</button>
      </div>
      <div class="card">
        <div id="rules-list"></div>
      </div>
    </div>
  </div>

</main>

<!-- Trade Modal -->
<div class="modal-overlay" id="trade-modal">
  <div class="modal">
    <h2>Log a Trade</h2>
    <div class="form-row">
      <div class="form-group">
        <label>Symbol</label>
        <input id="t-symbol" placeholder="EURUSD" />
      </div>
      <div class="form-group">
        <label>Direction</label>
        <select id="t-dir">
          <option value="long">Long</option>
          <option value="short">Short</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Entry</label>
        <input id="t-entry" type="number" step="any" placeholder="1.0850" />
      </div>
      <div class="form-group">
        <label>Exit</label>
        <input id="t-exit" type="number" step="any" placeholder="1.0900" />
      </div>
    </div>
    <div class="form-group">
      <label>Size</label>
      <input id="t-size" type="number" step="any" placeholder="1.0" />
    </div>
    <div class="form-group">
      <label>Notes</label>
      <textarea id="t-notes" rows="2" placeholder="What happened?"></textarea>
    </div>
    <div class="form-group">
      <label>Followed your rules?</label>
      <select id="t-rules">
        <option value="yes">Yes ✓</option>
        <option value="no">No ✗</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal('trade-modal')">Cancel</button>
      <button class="btn" onclick="submitTrade()">Log Trade</button>
    </div>
  </div>
</div>

<!-- Task Modal -->
<div class="modal-overlay" id="task-modal">
  <div class="modal">
    <h2>Add Task</h2>
    <div class="form-group">
      <label>Task</label>
      <input id="task-title" placeholder="What needs to get done?" />
    </div>
    <div class="form-group">
      <label>Priority</label>
      <select id="task-priority">
        <option value="high">High</option>
        <option value="medium" selected>Medium</option>
        <option value="low">Low</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal('task-modal')">Cancel</button>
      <button class="btn" onclick="submitTask()">Add Task</button>
    </div>
  </div>
</div>

<!-- Rules Modal -->
<div class="modal-overlay" id="rules-modal">
  <div class="modal">
    <h2>Set Trading Rules</h2>
    <div class="form-group">
      <label>Rules (one per line)</label>
      <textarea id="rules-input" rows="6" placeholder="Only trade with the trend&#10;Max 2% risk per trade&#10;No revenge trading"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal('rules-modal')">Cancel</button>
      <button class="btn" onclick="submitRules()">Save Rules</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

// Panel switching
function showPanel(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  $(`panel-${name}`).classList.add('active');
  event.target.classList.add('active');
  if (name === 'stats') loadStats();
  if (name === 'tasks') loadTasks();
  if (name === 'rules') loadRules();
}

// Chat
const messagesEl = $('chat-messages');

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  const initial = role === 'ace' ? 'A' : 'You';
  div.innerHTML = `
    <div class="msg-avatar">${initial[0]}</div>
    <div>
      <div class="msg-bubble">${escHtml(text)}</div>
      <div class="msg-time">${time}</div>
    </div>`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'msg ace';
  div.id = 'typing-indicator';
  div.innerHTML = `<div class="msg-avatar">A</div><div class="typing"><span></span><span></span><span></span></div>`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function hideTyping() {
  const t = $('typing-indicator');
  if (t) t.remove();
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

async function sendMessage() {
  const input = $('msg-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';
  addMessage('user', text);
  $('send-btn').disabled = true;
  showTyping();
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text})
    });
    const data = await res.json();
    hideTyping();
    if (data.type === 'trade_form') {
      openTradeModal();
      addMessage('ace', 'Opening trade log form for you.');
    } else {
      // strip rich markup tags for display
      const clean = data.text.replace(/\[\/?\w+(\s+\w+)?\]/g, '').replace(/\[\/?\w+\]/g, '');
      addMessage('ace', clean);
    }
  } catch (e) {
    hideTyping();
    addMessage('ace', 'Connection error. Try again.');
  }
  $('send-btn').disabled = false;
}

// Auto-resize textarea
$('msg-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

$('msg-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

// Welcome message
setTimeout(() => {
  addMessage('ace', "Hey! I'm Ace — your accountability partner. What's on your mind today?");
}, 300);

// Stats
async function loadStats() {
  const [stats, journal] = await Promise.all([
    fetch('/api/stats').then(r => r.json()),
    fetch('/api/journal').then(r => r.json())
  ]);

  $('s-trades').textContent = stats.total_trades;
  $('s-winrate').textContent = stats.win_rate + '%';

  const pnlEl = $('s-pnl');
  pnlEl.textContent = '$' + (stats.total_pnl >= 0 ? '+' : '') + stats.total_pnl.toFixed(2);
  pnlEl.className = 'val' + (stats.total_pnl < 0 ? ' neg' : '');

  $('s-streak').textContent = stats.streak + (stats.streak >= 3 ? ' 🔥' : '');

  const jEl = $('journal-list');
  if (!journal.length) {
    jEl.innerHTML = '<div class="empty-state">No trades logged yet.</div>';
    return;
  }
  jEl.innerHTML = [...journal].reverse().map(t => `
    <div class="trade-item">
      <div>
        <div class="trade-symbol">${t.symbol}</div>
        <div class="trade-dir">${t.direction.toUpperCase()} · ${t.date.slice(0,10)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="rules-badge ${t.followed_rules ? 'ok' : 'broke'}">${t.followed_rules ? 'Rules ✓' : 'Rules ✗'}</span>
        <span class="trade-pnl ${t.pnl >= 0 ? 'pos' : 'neg'}">${t.pnl >= 0 ? '+' : ''}$${t.pnl.toFixed(2)}</span>
      </div>
    </div>`).join('');
}

// Tasks
async function loadTasks() {
  const tasks = await fetch('/api/tasks').then(r => r.json());
  const el = $('task-list');
  if (!tasks.length) {
    el.innerHTML = '<div class="empty-state">No pending tasks. You\'re clear!</div>';
    return;
  }
  el.innerHTML = tasks.map(t => `
    <div class="task-item" id="task-${t.id}">
      <div class="task-check" onclick="completeTask(${t.id})"></div>
      <div class="task-title">${escHtml(t.title)}</div>
      <span class="priority ${t.priority}">${t.priority}</span>
    </div>`).join('');
}

async function completeTask(id) {
  await fetch(`/api/tasks/${id}/complete`, {method:'POST'});
  $(`task-${id}`).style.opacity = '0.3';
  setTimeout(() => { $(`task-${id}`)?.remove(); }, 400);
}

// Rules
async function loadRules() {
  const rules = await fetch('/api/rules').then(r => r.json());
  const el = $('rules-list');
  if (!rules.length) {
    el.innerHTML = '<div class="empty-state">No rules set. Add some to stay accountable.</div>';
    return;
  }
  el.innerHTML = `<div class="rules-list">${rules.map((r, i) => `
    <div class="rule-item"><div class="rule-num">${i+1}</div>${escHtml(r)}</div>`).join('')}</div>`;
}

// Modals
function openTradeModal() { $('trade-modal').classList.add('open'); }
function openTaskModal() { $('task-modal').classList.add('open'); }
function openRulesModal() {
  fetch('/api/rules').then(r => r.json()).then(rules => {
    $('rules-input').value = rules.join('\n');
    $('rules-modal').classList.add('open');
  });
}

function closeModal(id) { $(id).classList.remove('open'); }

document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); });
});

async function submitTrade() {
  const symbol = $('t-symbol').value.trim();
  const entry = parseFloat($('t-entry').value);
  const exit = parseFloat($('t-exit').value);
  const size = parseFloat($('t-size').value);
  if (!symbol || isNaN(entry) || isNaN(exit) || isNaN(size)) {
    alert('Please fill in all required fields.');
    return;
  }
  const res = await fetch('/api/trade', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      symbol, direction: $('t-dir').value,
      entry, exit_price: exit, size,
      notes: $('t-notes').value,
      followed_rules: $('t-rules').value === 'yes'
    })
  });
  const trade = await res.json();
  closeModal('trade-modal');
  const pnl = trade.pnl >= 0 ? `+$${trade.pnl.toFixed(2)}` : `-$${Math.abs(trade.pnl).toFixed(2)}`;
  addMessage('ace', `Trade logged! ${trade.symbol} ${trade.direction.toUpperCase()} ${pnl}${!trade.followed_rules ? '\n\nYou broke your rules. We need to talk about that.' : ' — nice discipline.'}`);
  showPanel({target: document.querySelector('.tab-btn')}, 'chat');
}

async function submitTask() {
  const title = $('task-title').value.trim();
  if (!title) return;
  await fetch('/api/tasks', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({title, priority: $('task-priority').value})
  });
  $('task-title').value = '';
  closeModal('task-modal');
  loadTasks();
}

async function submitRules() {
  const rules = $('rules-input').value.split('\n').map(r => r.trim()).filter(Boolean);
  await fetch('/api/rules', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({rules})
  });
  closeModal('rules-modal');
  loadRules();
}
</script>
</body>
</html>
